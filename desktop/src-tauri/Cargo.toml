[package]
name = "piwi-desktop"
version = "0.15.0" # x-release-please-version
description = "Piwi Dashboard desktop app"
authors = ["piwitests"]
license = "MIT"
repository = "https://github.com/PiwiTests/platform"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "piwi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
