<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Piwi Picker</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --surface: #f9fafb;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #7c3aed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --surface: #1f2937;
          --fg: #f9fafb;
          --muted: #9ca3af;
          --border: #374151;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 360px;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      .popup {
        padding: 14px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        font-weight: 600;
      }
      header img {
        border-radius: 5px;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button svg {
        width: 18px;
        height: 18px;
        margin-bottom: 2px;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        opacity: 0.9;
      }
      button .label {
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.3;
      }
      button .hint {
        color: var(--muted);
        font-size: 10.5px;
        line-height: 1.35;
      }
      button.primary .hint {
        color: #ffffffcc;
      }
      footer {
        margin-top: 12px;
        color: var(--muted);
        font-size: 11px;
      }
      footer a {
        color: inherit;
      }
      kbd {
        font:
          10.5px ui-monospace,
          monospace;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 4px;
      }
      #status {
        color: var(--muted);
        font-size: 11.5px;
        min-height: 14px;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <header><img src="icons/icon-32.png" width="18" height="18" alt="" /><span>Piwi Picker</span></header>
      <div id="status"></div>
      <div class="actions">
        <button id="record" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8" />
          </svg>
          <span class="label" id="record-label">Record actions</span>
          <span class="hint" id="record-hint">Multi-page → TypeScript</span>
        </button>
        <button id="pick" class="primary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="6.5" />
            <path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22" />
          </svg>
          <span class="label">Pick an element</span>
          <span class="hint">Ranked, stable locators</span>
        </button>
        <button id="hover-inspect" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12z" />
            <circle cx="12" cy="12" r="2.5" />
          </svg>
          <span class="label">Hover-inspect</span>
          <span class="hint">Toggle: locator tooltip</span>
        </button>
        <button id="locator-console" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="2.5" y="4" width="19" height="16" rx="2" />
            <path d="M6.5 9.5l3 2.5-3 2.5M13 15h4.5" />
          </svg>
          <span class="label">Locator console</span>
          <span class="hint">See matches live</span>
        </button>
        <button id="multi-pick" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="4" width="18" height="5" rx="1.5" />
            <rect x="3" y="12.5" width="18" height="5" rx="1.5" />
            <path d="M7 21h10" />
          </svg>
          <span class="label">Multi-pick</span>
          <span class="hint">2–3 items → a list</span>
        </button>
        <button id="lint-overlay" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3.5l9 16.5H3z" />
            <path d="M12 10v4M12 17h.01" />
          </svg>
          <span class="label">Lint overlay</span>
          <span class="hint">Untestable elements</span>
        </button>
        <button id="assertion-panel" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8.5" />
            <path d="M8 12.2l2.8 2.8L16 9" />
          </svg>
          <span class="label">Assertions</span>
          <span class="hint">Ranked expect(…) lines</span>
        </button>
        <button id="session-panel" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6.5 3h11a1 1 0 011 1v16.5l-6.5-3.8-6.5 3.8V4a1 1 0 011-1z" />
          </svg>
          <span class="label">Session</span>
          <span class="hint">Name picks → export</span>
        </button>
        <button id="agent-context-panel" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z" />
            <path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z" />
          </svg>
          <span class="label">Agent context</span>
          <span class="hint">Summary for an AI</span>
        </button>
      </div>
      <footer>
        <kbd>Ctrl+Shift+E</kbd> picks without opening this popup ·
        <a href="https://piwitests.github.io/extension" target="_blank" rel="noopener">docs</a> ·
        <a href="#" id="options-link">connect to Piwi</a>
      </footer>
    </div>
    <script type="module" src="src/popup/main.ts"></script>
  </body>
</html>
