<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Piwi Picker</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #7c3aed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --fg: #f9fafb;
          --muted: #9ca3af;
          --border: #374151;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 280px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .popup {
        padding: 14px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        font-weight: 600;
      }
      header img {
        border-radius: 5px;
      }
      button {
        display: block;
        width: 100%;
        margin-bottom: 8px;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      button .hint {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
      }
      button.primary .hint {
        color: #ffffffcc;
      }
      footer {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      footer a {
        color: inherit;
      }
      kbd {
        font: 10.5px ui-monospace, monospace;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 4px;
      }
      #status {
        color: var(--muted);
        font-size: 11.5px;
        min-height: 14px;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <header><img src="icons/icon-32.png" width="18" height="18" alt="" /><span>Piwi Picker</span></header>
      <div id="status"></div>
      <button id="pick" class="primary" type="button">
        Pick an element
        <span class="hint">Guided pick → ranked locators → copy</span>
      </button>
      <button id="hover-inspect" type="button">
        Toggle hover-inspect
        <span class="hint">Best locator in a tooltip, no click needed</span>
      </button>
      <button id="locator-console" type="button">
        Locator console
        <span class="hint">Type a locator, see matches highlighted live</span>
      </button>
      <button id="multi-pick" type="button">
        Multi-pick pattern
        <span class="hint">Pick 2-3 similar items → derive a list locator</span>
      </button>
      <button id="lint-overlay" type="button">
        Lint overlay
        <span class="hint">Outline untestable elements, export a checklist</span>
      </button>
      <footer>
        <kbd>Ctrl+Shift+E</kbd> picks without opening this popup ·
        <a href="https://piwitests.github.io/extension" target="_blank" rel="noopener">docs</a>
      </footer>
    </div>
    <script type="module" src="src/popup/main.ts"></script>
  </body>
</html>
