name: Desktop E2E

# Smoke-tests the real desktop shell by driving its webview with Playwright via
# tauri-plugin-playwright (the app is built with the `e2e-testing` feature, which
# embeds the control plugin). This boots the whole app — server sidecar + native
# window — so it is heavier and slower than the unit/integration CI; it runs only
# on desktop changes and on demand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-e2e.yml'

env:
  # Match the runtime the app bundles (apps/application/engines / desktop-release.yml).
  PIWI_NODE_VERSION: 24.4.1

jobs:
  e2e:
    # macOS runs the real Tauri webview headed (no xvfb), matching the plugin's
    # own e2e setup.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PIWI_NODE_VERSION }}
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Build the server bundle
        # The Nuxt/Vite SSR build needs more heap than Node's default cap on the
        # macOS runner (it OOMs at ~2 GB otherwise; the ubuntu builds get a higher
        # default and don't need this).
        run: npm run app:build --workspace=apps/application
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      - name: Stage the Node sidecar + bundled server
        working-directory: apps/desktop
        run: |
          node scripts/fetch-node.mjs --node "$PIWI_NODE_VERSION"
          npm run stage

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Generate app icons
        working-directory: apps/desktop
        run: npx tauri icon ../application/public/logo.svg

      - name: Install Playwright runtime
        working-directory: apps/desktop
        run: npx playwright install chromium

      # Compile up front so `tauri dev` (launched by the fixture) only has to boot,
      # keeping startup inside the fixture's startTimeout.
      - name: Pre-build the shell (e2e feature)
        working-directory: apps/desktop/src-tauri
        run: cargo build --features e2e-testing

      - name: Run e2e
        working-directory: apps/desktop
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-report
          path: apps/desktop/playwright-report
          if-no-files-found: ignore
