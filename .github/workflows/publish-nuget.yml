name: Publish NuGet Package

on:
  push:
    tags: ['v*']
  # Manual escape hatch: run against an existing tag (e.g. one release-please
  # created that didn't auto-trigger this workflow — see release-please.yml).
  workflow_dispatch:

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Pack & push
        run: |
          dotnet pack integrations/aspnetcore/PiwiTests.Instrumentation.AspNetCore \
            -c Release \
            -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json
